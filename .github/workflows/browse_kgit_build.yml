
      - name: Generate or repair Android host project
        run: |
          set -euo pipefail

          PKG="$(tr -d '[:space:]' < app_package.txt 2>/dev/null || true)"
          if ! echo "$PKG" | grep -Eq '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$'; then
            PKG="com.example.app"
          fi

          MANIFEST="android/app/src/main/AndroidManifest.xml"
          BRIDGE_BACKUP="$RUNNER_TEMP/kgit_MainActivity.kt"

          # Preserve our custom native DownloadManager implementation.
          if [ -d android ]; then
            find android/app/src/main/kotlin -name MainActivity.kt -print -quit 2>/dev/null | while read -r FILE; do
              if [ -n "$FILE" ]; then
                cp "$FILE" "$BRIDGE_BACKUP"
              fi
            done
          fi

          # Generate a complete Android project if the manifest is missing.
          if [ ! -f "$MANIFEST" ]; then
            echo "Android scaffold missing or incomplete. Generating it..."

            flutter create \
              --platforms=android \
              --project-name "${PKG##*.}" \
              --org "${PKG%.*}" \
              /tmp/kgit_scaffold

            rm -rf android
            cp -r /tmp/kgit_scaffold/android ./android
          fi

          # Restore the native download bridge in the correct package location.
          if [ -f "$BRIDGE_BACKUP" ]; then
            PKG_PATH="${PKG//./\/}"
            DEST="android/app/src/main/kotlin/$PKG_PATH/MainActivity.kt"

            mkdir -p "$(dirname "$DEST")"
            cp "$BRIDGE_BACKUP" "$DEST"

            sed -i "1s/^package .*/package $PKG/" "$DEST"

            echo "Restored native DownloadManager bridge: $DEST"
          fi

          # Set the application display name.
          NAME="$(head -n1 app_name.txt 2>/dev/null | tr -d '\r' | xargs || true)"

          if [ -z "$NAME" ]; then
            NAME="${PKG##*.}"
          fi

          NAME="$(printf '%s' "$NAME" | sed 's/[&"<>|]//g')"

          if [ -n "$NAME" ]; then
            sed -i "s|android:label=\"[^\"]*\"|android:label=\"$NAME\"|" "$MANIFEST"
          fi

          test -f "$MANIFEST"
          echo "Android host project is ready."
