# Installed by K-Git Studio. Run it from the Builds tab.
name: K-Git Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'What to build'
        required: true
        default: apk
        type: choice
        options:
          - apk
          - aab
          - both
      publish_release:
        description: 'Also publish the files as a GitHub pre-release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write # needed only to publish a release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android host project (if missing)
        run: |
          set -euo pipefail
          if [ ! -d android ]; then
            # app_package.txt (one line, for example com.company.app) is the single place the package name lives.
            PKG="$(tr -d '[:space:]' < app_package.txt 2>/dev/null || true)"
            if ! echo "$PKG" | grep -Eq '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$'; then PKG="com.mycompany.webtoapp"; fi
            flutter create --platforms=android --project-name "${PKG##*.}" --org "${PKG%.*}" /tmp/kgit_scaffold
            cp -r /tmp/kgit_scaffold/android ./android
            # App name: app_name.txt (one line) is the single place it lives. Without it, the pubspec name is title-cased.
            NAME="$(head -n1 app_name.txt 2>/dev/null | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' || true)"
            if [ -z "$NAME" ]; then
              NAME="$(grep -m1 '^name:' pubspec.yaml | sed 's/^name:[[:space:]]*//' | tr '_' ' ' | sed -E 's/(^| )([a-z])/\1\u\2/g')"
            fi
            NAME="$(printf '%s' "$NAME" | sed 's/[&"<>|]//g')"
            if [ -n "$NAME" ]; then
              sed -i "s|android:label=\"[^\"]*\"|android:label=\"$NAME\"|" android/app/src/main/AndroidManifest.xml
              echo "App name: $NAME"
            fi
          fi

      - name: Wire Android permissions (app_permissions.txt, or detected from pubspec.yaml)
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import re
          DEPS = {
              "local_auth": ["android.permission.USE_BIOMETRIC"],
              "flutter_local_notifications": ["android.permission.POST_NOTIFICATIONS", "android.permission.VIBRATE", "android.permission.RECEIVE_BOOT_COMPLETED"],
              "awesome_notifications": ["android.permission.POST_NOTIFICATIONS", "android.permission.VIBRATE"],
              "firebase_messaging": ["android.permission.POST_NOTIFICATIONS"],
              "workmanager": ["android.permission.RECEIVE_BOOT_COMPLETED", "android.permission.WAKE_LOCK"],
              "wakelock_plus": ["android.permission.WAKE_LOCK"],
              "vibration": ["android.permission.VIBRATE"],
              "geolocator": ["android.permission.ACCESS_COARSE_LOCATION", "android.permission.ACCESS_FINE_LOCATION"],
              "location": ["android.permission.ACCESS_COARSE_LOCATION", "android.permission.ACCESS_FINE_LOCATION"],
              "camera": ["android.permission.CAMERA", "android.permission.RECORD_AUDIO"],
              "mobile_scanner": ["android.permission.CAMERA"],
              "qr_code_scanner": ["android.permission.CAMERA"],
              "record": ["android.permission.RECORD_AUDIO"],
              "flutter_contacts": ["android.permission.READ_CONTACTS"],
              "flutter_phone_direct_caller": ["android.permission.CALL_PHONE"],
              "flutter_blue_plus": ["android.permission.BLUETOOTH_CONNECT", "android.permission.BLUETOOTH_SCAN"],
              "nfc_manager": ["android.permission.NFC"],
              "connectivity_plus": ["android.permission.ACCESS_NETWORK_STATE"],
              "open_filex": ["android.permission.REQUEST_INSTALL_PACKAGES"],
              "ota_update": ["android.permission.REQUEST_INSTALL_PACKAGES"],
              "http": ["android.permission.INTERNET"],
              "dio": ["android.permission.INTERNET"],
              "webview_flutter": ["android.permission.INTERNET"],
              "flutter_inappwebview": ["android.permission.INTERNET"],
              "firebase_core": ["android.permission.INTERNET"],
              "supabase_flutter": ["android.permission.INTERNET"],
          }
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text(encoding="utf-8")
          chosen = []
          listed = Path("app_permissions.txt")
          if listed.exists():
              source = "app_permissions.txt"
              for line in listed.read_text(encoding="utf-8").splitlines():
                  line = line.strip()
                  if line and not line.startswith("#"):
                      chosen.append(line if "." in line else "android.permission." + line)
          else:
              source = "pubspec.yaml (there is no app_permissions.txt)"
              chosen.append("android.permission.INTERNET")
              pub = Path("pubspec.yaml").read_text(encoding="utf-8") if Path("pubspec.yaml").exists() else ""
              for pkg, perms in DEPS.items():
                  if re.search(r'^\s{2}' + re.escape(pkg) + r'\s*:', pub, re.M):
                      chosen.extend(perms)
          chosen = list(dict.fromkeys(chosen))
          added = []
          for perm in chosen:
              if 'android:name="' + perm + '"' not in content:
                  m = re.search(r'<manifest\b[^>]*>', content)
                  if not m:
                      raise SystemExit("Could not find the <manifest> tag.")
                  content = content[:m.end()] + '\n    <uses-permission android:name="' + perm + '"/>' + content[m.end():]
                  added.append(perm)
          manifest.write_text(content, encoding="utf-8")
          print("Permissions from", source)
          for perm in chosen:
              print(("  added    " if perm in added else "  present  ") + perm)
          if "android.permission.USE_BIOMETRIC" in chosen:
              # The fingerprint prompt needs a FragmentActivity and an AppCompat theme.
              for f in Path("android/app/src/main").rglob("MainActivity.*"):
                  if f.suffix in (".kt", ".java"):
                      t = f.read_text(encoding="utf-8")
                      n = re.sub(r'\bFlutterActivity\b', 'FlutterFragmentActivity', t)
                      if n != t:
                          f.write_text(n, encoding="utf-8")
                          print("Fingerprint: patched", f)
              for f in Path("android/app/src/main/res").glob("values*/styles.xml"):
                  t = f.read_text(encoding="utf-8")
                  n = t.replace("@android:style/Theme.Light.NoTitleBar", "Theme.AppCompat.Light.NoActionBar")
                  n = n.replace("@android:style/Theme.Black.NoTitleBar", "Theme.AppCompat.NoActionBar")
                  if n != t:
                      f.write_text(n, encoding="utf-8")
                      print("Fingerprint: patched", f)
          PYCODE

      - name: Set Android compile SDK to API 36
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import re

          candidates = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle"),
          ]
          gradle_file = next((path for path in candidates if path.is_file()), None)
          if gradle_file is None:
              raise SystemExit("Android app Gradle file was not found.")

          content = gradle_file.read_text(encoding="utf-8")
          patterns = [
              (r'(?m)^(\s*compileSdk\s*=\s*)flutter\.compileSdkVersion\s*$', r'\g<1>36'),
              (r'(?m)^(\s*compileSdkVersion\s+)flutter\.compileSdkVersion\s*$', r'\g<1>36'),
              (r'(?m)^(\s*compileSdk\s+)flutter\.compileSdkVersion\s*$', r'\g<1>36'),
          ]
          updated = content
          for pattern, replacement in patterns:
              updated, count = re.subn(pattern, replacement, updated, count=1)
              if count:
                  break
          if updated == content:
              if re.search(r'(?m)^\s*compileSdk(?:Version)?\s*(?:=\s*)?36\s*$', content):
                  print(f"Android compile SDK is already API 36 in {gradle_file}.")
              else:
                  raise SystemExit(f"Could not safely locate Flutter compileSdk setting in {gradle_file}.")
          else:
              gradle_file.write_text(updated, encoding="utf-8")
              print(f"Set Android compile SDK to API 36 in {gradle_file}.")
          PYCODE

      - name: Enable core library desugaring (only when the app needs it)
        run: |
          if ! grep -q flutter_local_notifications pubspec.yaml; then echo 'Not needed.'; exit 0; fi
          python3 - <<'PYCODE'
          from pathlib import Path
          import re
          kts = Path("android/app/build.gradle.kts")
          groovy = Path("android/app/build.gradle")
          if kts.is_file():
              f, is_kts = kts, True
          elif groovy.is_file():
              f, is_kts = groovy, False
          else:
              raise SystemExit("android/app build.gradle(.kts) not found.")
          content = f.read_text(encoding="utf-8")
          if 'oreLibraryDesugaring' in content:
              print("Desugaring already enabled.")
          else:
              m = re.search(r'compileOptions\s*\{', content)
              if not m:
                  raise SystemExit("Could not find compileOptions in " + str(f))
              flag = "isCoreLibraryDesugaringEnabled = true" if is_kts else "coreLibraryDesugaringEnabled true"
              content = content[:m.end()] + "\n        " + flag + content[m.end():]
              dep = ('\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
                     if is_kts else
                     "\ndependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'\n}\n")
              content += dep
              f.write_text(content, encoding="utf-8")
              print("Enabled core library desugaring in " + str(f))
          PYCODE

      - name: Install signing key (only when all four secrets are set)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ] && [ -n "${ANDROID_KEYSTORE_PASSWORD:-}" ] && [ -n "${ANDROID_KEY_ALIAS:-}" ] && [ -n "${ANDROID_KEY_PASSWORD:-}" ]; then
            mkdir -p "$RUNNER_TEMP/kgit-signing"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kgit-signing/release.jks"
            test -s "$RUNNER_TEMP/kgit-signing/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/kgit-signing/release.jks" >> "$GITHUB_ENV"
            echo "KGIT_SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "::warning::Signing secrets are not all set. This build is NOT signed with your release key."
          fi

      - name: Configure release signing
        if: ${{ env.KGIT_SIGNED == 'true' }}
        run: |
          python3 - <<'PYCODE'
          #!/usr/bin/env python3
          """Configure the generated Android module to use K-Git Studio's CI keystore."""
          from pathlib import Path
          import re


          def matching_brace(text: str, open_pos: int) -> int:
              depth = 0
              quote = None
              escaped = False
              line_comment = False
              block_comment = False
              i = open_pos
              while i < len(text):
                  ch = text[i]
                  nxt = text[i + 1] if i + 1 < len(text) else ""
                  if line_comment:
                      if ch == "\n": line_comment = False
                  elif block_comment:
                      if ch == "*" and nxt == "/":
                          block_comment = False; i += 1
                  elif quote:
                      if escaped: escaped = False
                      elif ch == "\\": escaped = True
                      elif ch == quote: quote = None
                  else:
                      if ch == "/" and nxt == "/": line_comment = True; i += 1
                      elif ch == "/" and nxt == "*": block_comment = True; i += 1
                      elif ch in ("'", '"'): quote = ch
                      elif ch == "{": depth += 1
                      elif ch == "}":
                          depth -= 1
                          if depth == 0: return i
                  i += 1
              raise SystemExit("ERROR: Unbalanced braces in Android Gradle file.")


          def find_block(text: str, name: str, start: int = 0):
              m = re.search(r"(?m)^([ \t]*)" + re.escape(name) + r"\s*\{", text[start:])
              if not m: return None
              brace = start + m.end() - 1
              return start + m.start(), brace, matching_brace(text, brace), m.group(1)

          candidates = [Path("android/app/build.gradle.kts"), Path("android/app/build.gradle")]
          gradle = next((p for p in candidates if p.is_file()), None)
          if gradle is None:
              raise SystemExit("ERROR: Android Gradle file not found.")

          text = gradle.read_text(encoding="utf-8")
          is_kts = gradle.suffix == ".kts"
          android = find_block(text, "android")
          if android is None:
              raise SystemExit("ERROR: Could not find android { } block.")

          # Remove any previous kgitRelease signingConfigs block so reruns are idempotent.
          while True:
              android = find_block(text, "android")
              found = find_block(text[android[1] + 1:android[2]], "signingConfigs")
              if not found: break
              start = android[1] + 1 + found[0]
              end = android[1] + 1 + found[2] + 1
              text = text[:start] + text[end:]

          android = find_block(text, "android")
          indent = android[3] + "    "
          if is_kts:
              signing = (
                  f'{indent}signingConfigs {{\n'
                  f'{indent}    create("kgitRelease") {{\n'
                  f'{indent}        val ksPath = System.getenv("ANDROID_KEYSTORE_PATH")\n'
                  f'{indent}            ?: error("ANDROID_KEYSTORE_PATH is missing")\n'
                  f'{indent}        storeFile = file(ksPath)\n'
                  f'{indent}        storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")\n'
                  f'{indent}            ?: error("ANDROID_KEYSTORE_PASSWORD is missing")\n'
                  f'{indent}        keyAlias = System.getenv("ANDROID_KEY_ALIAS")\n'
                  f'{indent}            ?: error("ANDROID_KEY_ALIAS is missing")\n'
                  f'{indent}        keyPassword = System.getenv("ANDROID_KEY_PASSWORD")\n'
                  f'{indent}            ?: error("ANDROID_KEY_PASSWORD is missing")\n'
                  f'{indent}    }}\n'
                  f'{indent}}}\n\n'
              )
              release_line = f'{indent}        signingConfig = signingConfigs.getByName("kgitRelease")'
          else:
              signing = (
                  f'{indent}signingConfigs {{\n'
                  f'{indent}    kgitRelease {{\n'
                  f'{indent}        storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))\n'
                  f'{indent}        storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")\n'
                  f'{indent}        keyAlias System.getenv("ANDROID_KEY_ALIAS")\n'
                  f'{indent}        keyPassword System.getenv("ANDROID_KEY_PASSWORD")\n'
                  f'{indent}    }}\n'
                  f'{indent}}}\n\n'
              )
              release_line = f'{indent}        signingConfig signingConfigs.kgitRelease'

          # Insert signing config immediately inside android block.
          insert_at = android[1] + 1
          text = text[:insert_at] + "\n" + signing + text[insert_at:]

          android = find_block(text, "android")
          build_types = find_block(text[android[1] + 1:android[2]], "buildTypes")
          if build_types is None:
              raise SystemExit("ERROR: Could not find buildTypes { } inside android block.")
          bt_start = android[1] + 1 + build_types[0]
          bt_open = android[1] + 1 + build_types[1]
          bt_close = android[1] + 1 + build_types[2]
          release = find_block(text[bt_open + 1:bt_close], "release")
          if release is None:
              raise SystemExit("ERROR: Could not find release { } inside buildTypes.")
          rel_open = bt_open + 1 + release[1]
          rel_close = bt_open + 1 + release[2]
          body = text[rel_open + 1:rel_close]
          # Replace any existing release signingConfig line, regardless of debug/release name.
          body = re.sub(r"(?m)^\s*signingConfig\s*(?:=.*|\S.*)$", "", body)
          body = "\n" + release_line + body
          text = text[:rel_open + 1] + body + text[rel_close:]
          gradle.write_text(text, encoding="utf-8")
          print(f"Configured persistent K-Git Studio release signing in {gradle}")
          PYCODE

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icons (assets/icon/app_icon.png first, then pubspec settings)
        run: |
          set -euo pipefail
          if [ -f assets/icon/app_icon.png ]; then
            echo "Using assets/icon/app_icon.png as the app icon."
            printf 'flutter_launcher_icons:\n  android: true\n  ios: false\n  image_path: "assets/icon/app_icon.png"\n  min_sdk_android: 21\n' > flutter_launcher_icons.yaml
            flutter pub add --dev flutter_launcher_icons
            dart run flutter_launcher_icons
            # The file must be named flutter_launcher_icons.yaml. A name such as
            # flutter_launcher_icons-kgit.yaml makes the tool treat it as a build flavor and write
            # the icons to a folder that is never used, which left the default Flutter icon.
            # A template can ship an adaptive icon (mipmap-anydpi-v26) or point the
            # manifest at another icon name. Both would hide the new icon.
            # Remove every adaptive-icon definition (any mipmap-anydpi* folder, any drawable) so Android
            # uses the PNG icons that were just generated.
            find android/app/src/main/res -path '*mipmap-anydpi*' -name 'ic_launcher*.xml' -delete 2>/dev/null || true
            find android/app/src/main/res -name 'ic_launcher_foreground*' -delete 2>/dev/null || true
            find android/app/src/main/res -name 'ic_launcher_background*' -delete 2>/dev/null || true
            echo 'Launcher icon files now in the project:'
            find android/app/src/main/res -name 'ic_launcher*' | sort
            if [ -f android/app/src/main/AndroidManifest.xml ]; then
              sed -i -E 's#android:icon="@[a-z]+/[A-Za-z0-9_]+"#android:icon="@mipmap/ic_launcher"#' android/app/src/main/AndroidManifest.xml
              sed -i -E 's#android:roundIcon="@[a-z]+/[A-Za-z0-9_]+"#android:roundIcon="@mipmap/ic_launcher"#' android/app/src/main/AndroidManifest.xml
            fi
          elif grep -q '^flutter_launcher_icons:' pubspec.yaml; then
            IMG="$(grep -m1 -E '^[[:space:]]+image_path:' pubspec.yaml | sed -E 's/^[^:]+:[[:space:]]*//;s/["'"'"']//g' | tr -d '\r')"
            if [ -z "$IMG" ] || [ ! -f "$IMG" ]; then
              echo "::warning::Icon image '$IMG' was not found. The default Flutter icon is used."
              exit 0
            fi
            grep -qE '^[[:space:]]+flutter_launcher_icons:' pubspec.yaml || flutter pub add --dev flutter_launcher_icons
            dart run flutter_launcher_icons
          else
            echo 'No icon settings in pubspec.yaml and no assets/icon/app_icon.png. The default Flutter icon is used.'
          fi

      # Flutter plugins are separate Gradle subprojects. Updating only :app does
      # not update a plugin module such as :file_picker, which can keep API 34.
      - name: Set Android plugin modules to compile SDK 36
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from pathlib import Path
          import os
          import re

          pub_cache = Path(os.environ.get("PUB_CACHE", Path.home() / ".pub-cache"))
          package_root = pub_cache / "hosted" / "pub.dev"
          if not package_root.is_dir():
              raise SystemExit(f"Pub package cache not found: {package_root}")

          pattern = re.compile(
              r"(?m)^(\s*compileSdk(?:Version)?\s*(?:=\s*)?)"
              r"(?:flutter\.compileSdkVersion|[0-9]+)(\s*(?://.*)?)$"
          )
          # Keep Path objects for the verification below.
          changed: list[Path] = []
          for gradle_file in package_root.glob("*/android/build.gradle*"):
              if gradle_file.suffix not in {".gradle", ".kts"}:
                  continue
              original = gradle_file.read_text(encoding="utf-8")
              updated, count = pattern.subn(r"\g<1>36\g<2>", original)
              if count:
                  gradle_file.write_text(updated, encoding="utf-8")
                  changed.append(gradle_file)

          lock = Path("pubspec.lock")
          uses_file_picker = lock.is_file() and re.search(r"(?m)^  file_picker:", lock.read_text(encoding="utf-8")) is not None
          if uses_file_picker:
              candidates = list(package_root.glob("file_picker-*/android/build.gradle*"))
              ok = any(
                  re.search(r"(?m)^\s*compileSdk(?:Version)?\s*(?:=\s*)?36\b", p.read_text(encoding="utf-8"))
                  for p in candidates
              )
              if not candidates:
                  # Newer file_picker versions keep the Android code in android_file_picker,
                  # which is patched above with every other plugin.
                  print("file_picker has no Android module of its own. Nothing to verify.")
              elif not ok:
                  raise SystemExit("Could not set or verify file_picker compileSdk 36.")
              else:
                  print("Verified file_picker Android module uses compileSdk 36.")
          else:
              print("This project does not use file_picker. Nothing to verify.")

          print(f"Updated {len(changed)} Flutter plugin Android Gradle file(s) to compileSdk 36.")
          for item in changed:
              print(f"  - {item}")
          PYCODE

      - name: Analyze (non-blocking)
        run: flutter analyze
        continue-on-error: true

      - name: Build APK
        if: ${{ inputs.build_type == 'apk' || inputs.build_type == 'both' }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release --build-number "$GITHUB_RUN_NUMBER"

      - name: Build AAB
        if: ${{ inputs.build_type == 'aab' || inputs.build_type == 'both' }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build appbundle --release --build-number "$GITHUB_RUN_NUMBER"

      - name: Name the files after the app
        run: |
          set -euo pipefail
          NAME="$(head -n1 app_name.txt 2>/dev/null | tr -d '\r' || true)"
          [ -n "$NAME" ] || NAME="${GITHUB_REPOSITORY#*/}"
          SLUG="$(printf '%s' "$NAME" | sed 's/[^A-Za-z0-9._-]/-/g;s/--*/-/g;s/^-//;s/-$//')"
          [ -n "$SLUG" ] || SLUG="app"
          echo "APP_SLUG=$SLUG" >> "$GITHUB_ENV"
          APK=build/app/outputs/flutter-apk/app-release.apk
          AAB=build/app/outputs/bundle/release/app-release.aab
          if [ -f "$APK" ]; then cp "$APK" "build/app/outputs/flutter-apk/$SLUG.apk"; fi
          if [ -f "$AAB" ]; then cp "$AAB" "build/app/outputs/bundle/release/$SLUG.aab"; fi

      - name: Upload APK
        if: ${{ inputs.build_type == 'apk' || inputs.build_type == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_SLUG }}-apk
          path: build/app/outputs/flutter-apk/${{ env.APP_SLUG }}.apk
          retention-days: 14

      - name: Upload AAB
        if: ${{ inputs.build_type == 'aab' || inputs.build_type == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_SLUG }}-aab
          path: build/app/outputs/bundle/release/${{ env.APP_SLUG }}.aab
          retention-days: 14

      - name: Verify APK signature
        if: ${{ env.KGIT_SIGNED == 'true' && (inputs.build_type == 'apk' || inputs.build_type == 'both') }}
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/apksigner"
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk

      - name: Show which key signed this build
        if: ${{ always() }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ "${KGIT_SIGNED:-}" = "true" ] && [ -n "${ANDROID_KEYSTORE_PATH:-}" ] && [ -f "$ANDROID_KEYSTORE_PATH" ]; then
            FP="$(keytool -list -v -keystore "$ANDROID_KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" 2>/dev/null | grep -m1 'SHA256:' | sed 's/^ *//' || true)"
            echo "Signed with your permanent release key. $FP"
            {
              echo "### Signing"
              echo "Signed with your permanent release key."
              echo "\`$FP\`"
              echo "Every update must show the same fingerprint."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::This build is NOT signed with a permanent release key. Google Play will not accept it as an update."
            echo "### Signing" >> "$GITHUB_STEP_SUMMARY"
            echo "NOT signed with a permanent key. Add the four ANDROID_ secrets in Release Signing Setup." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish GitHub pre-release
        if: ${{ inputs.publish_release == true }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find . -path '*/build/*outputs*' \( -name '*.apk' -o -name '*.aab' \) -not -name 'app-release.*' -not -path './.git/*')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No APK or AAB files were found to publish."
            exit 1
          fi
          gh release create "build-${GITHUB_RUN_NUMBER}" "${files[@]}" \
            --title "Build ${GITHUB_RUN_NUMBER}" \
            --notes "Built by K-Git Studio from ${GITHUB_SHA::7}" \
            --target "$GITHUB_SHA" --prerelease

      - name: Remove temporary signing material
        if: always()
        run: rm -rf "$RUNNER_TEMP/kgit-signing"
