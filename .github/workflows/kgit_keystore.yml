name: K-Git create keystore

on:
  workflow_dispatch:
    inputs:
      owner:
        description: Name written inside the certificate
        required: false
        default: K-Git Studio

permissions:
  contents: read

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - name: Create the keystore and encrypt it
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          OWNER: ${{ inputs.owner }}
        run: |
          set -euo pipefail
          if [ -z "$KS_PASS" ] || [ -z "$KEY_ALIAS" ]; then
            echo "The signing secrets are missing."
            exit 1
          fi
          CN="$(printf '%s' "${OWNER:-K-Git Studio}" | tr -cd 'A-Za-z0-9 ._-' | cut -c1-60)"
          if [ -z "$CN" ]; then CN="K-Git Studio"; fi
          keytool -genkeypair -noprompt \
            -keystore upload-keystore.jks -storetype PKCS12 \
            -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KS_PASS" -keypass "$KS_PASS" \
            -dname "CN=$CN, O=$CN"
          pip install --quiet pynacl || pip install --quiet --break-system-packages pynacl
          python3 - <<'PY'
          import hashlib, os
          from nacl.secret import SecretBox
          key = hashlib.sha256(os.environ["KS_PASS"].encode()).digest()
          data = open("upload-keystore.jks", "rb").read()
          open("keystore.enc", "wb").write(bytes(SecretBox(key).encrypt(data)))
          PY
          rm -f upload-keystore.jks

      - name: Upload the encrypted keystore
        uses: actions/upload-artifact@v4
        with:
          name: kgit-keystore
          path: keystore.enc
          retention-days: 1
