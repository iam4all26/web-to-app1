name: kgit_downloader
description: Hands a file download to Android's DownloadManager (Downloads folder, system notification).
version: 1.0.0
publish_to: "none"

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.kgit.downloader
        pluginClass: KgitDownloaderPlugin
